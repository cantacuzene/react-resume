query ResumePage($lang: Lang!) {
  resume(lang: $lang) {
    profile {
      name
      jobTitle
      location
      email
      links {
        kind
        url
        label
      }
    }
    about {
      cover
      interests
    }
    skills {
      name
      rating
    }
    educations {
      id
      year
      school
      location
      title
    }
    experiences {
      id
      title
      company
      start
      end
      description
      mission
      stack
    }
    spokenLanguages {
      name
      rating
    }
  }
  translations(lang: $lang) {
    sections {
      about
      skills
      education
      languages
      experiences
    }
    header {
      switchTo
      emailMe
      downloadResume
      downloadFailed
    }
    timeline {
      present
      description
      mission
      stack
    }
    aria {
      switchLanguage
      retry
      loading
    }
  }
  siteLanguages(lang: $lang) {
    code
    label
  }
}
